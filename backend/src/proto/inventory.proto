syntax = "proto3";
package inventory;

service InventoryService {
  rpc GetStock (GetStockRequest) returns (GetStockResponse);
  rpc Reserve (ReserveRequest) returns (ReserveResponse);
  rpc Release (ReleaseRequest) returns (ReleaseResponse);
  rpc SetStock (SetStockRequest) returns (GetStockResponse);
}

message GetStockRequest  { string product_id = 1; }
message GetStockResponse { string product_id = 1; int32 quantity = 2; }

message ReserveItem    { string product_id = 1; int32 quantity = 2; }
message ReserveRequest { string order_ref = 1; repeated ReserveItem items = 2; }
message ReserveResponse { bool success = 1; }

message ReleaseRequest  { string order_ref = 1; }
message ReleaseResponse { bool released = 1; }

message SetStockRequest { string product_id = 1; int32 quantity = 2; }
