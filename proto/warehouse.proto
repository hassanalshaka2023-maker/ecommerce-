syntax = "proto3";

package warehouse;

service Warehouse {
  // How many units of this product are left?
  rpc GetStock (ProductId) returns (Stock);
  // Admin sets the quantity of a product.
  rpc SetStock (Stock) returns (Stock);
  // Reserve all items of one order: all or nothing.
  rpc ReserveStock (Reservation) returns (Empty);
  // Give back what was reserved for this order.
  rpc ReleaseStock (OrderId) returns (Empty);
}

message ProductId {
  string product_id = 1;
}

message OrderId {
  string order_id = 1;
}

message Stock {
  string product_id = 1;
  int32 quantity = 2;
}

message Reservation {
  string order_id = 1;
  repeated Stock items = 2;
}

message Empty {}
