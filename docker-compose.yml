name: ecommerce-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432" # 5433 on the host, so it never clashes with a locally installed Postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 10

  # Read-only copy of db. On its first start it copies the primary (pg_basebackup),
  # and -R makes it follow the primary's changes from then on.
  db-replica:
    image: postgres:16-alpine
    user: postgres
    environment:
      PGPASSWORD: postgres
    command: >
      sh -c "[ -s /var/lib/postgresql/data/PG_VERSION ] ||
      pg_basebackup -h db -U postgres -D /var/lib/postgresql/data -R -X stream;
      chmod 700 /var/lib/postgresql/data;
      exec postgres"
    ports:
      - "5435:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ecommerce
      DATABASE_REPLICA_URL: postgres://postgres:postgres@db-replica:5432/ecommerce
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      ADMIN_EMAIL: admin@shop.local
      ADMIN_PASSWORD: Admin12345
      WAREHOUSE_URL: warehouse:50051
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_LOGGING: ${DB_LOGGING:-false} # true prints every SQL query in the api logs
    ports:
      - "3001:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Sends the confirmation email of every new order. Same code as the api, a different program:
  # it only reads the "emails" queue, and the api never waits for it.
  worker:
    build:
      context: ./backend
      additional_contexts:
        proto: ./proto
    command: ["node", "dist/worker/main.js"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # By default the emails go to Mailpit (http://localhost:8025). For a real provider,
      # put the SMTP_* values in a .env file next to this one (see .env.example).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-shop@example.com}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management page: http://localhost:15672 (guest / guest)
    volumes:
      - rabbit_data:/var/lib/rabbitmq # queues and their messages survive a restart
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  # Catches every email in a web page, so the whole flow can be seen without a real mail account.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web page
      - "1025:1025" # SMTP

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    ports:
      - "5434:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 10

  warehouse:
    build:
      context: ./warehouse
      additional_contexts:
        proto: ./proto
    environment:
      DATABASE_URL: postgresql://postgres:postgres@warehouse-db:5432/warehouse
    ports:
      - "50051:50051"
    depends_on:
      warehouse-db:
        condition: service_healthy



volumes:
  db_data:
  replica_data:
  uploads_data:
  warehouse_data:
  rabbit_data:

